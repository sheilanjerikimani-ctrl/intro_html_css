<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <!-- git add . -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap');
        *{
            padding:0;
            margin:0;
        }

        body {
            font-family: "PT Sans", sans-serif;
            margin: 0;


        }

        nav {
            display: flex;
            justify-content: center;
            /* background-color:#7b68ee; */
            border-bottom: 1px solid #f5deb3;

        }

        .content {
            /* background-color: #6f2db1; */
            width: 70%;
            display: flex;

            justify-content: space-between;
            align-items: center;

        }

        .logo img {
            width: 50px;
            height: 60px;
        }
        .content ul{
            display:flex;
            /* remove bullets */
            list-style-type:none;
        }
        .content li{
            margin-left: 16px;
            margin-right: 16px;
        }
        .content a{
            text-decoration: none;
            color:#000000;
            padding: 12px 14px;
            text-transform: uppercase;
        }
        .content a:hover{
            color:#868383;
            background-color: #424141;
            text-decoration: underline;
            border-bottom:1px solid black;
            
        }
    </style>
</head>

<body>
    <!-- semantic tags -->
    <footer></footer>
    <header></header>
    <nav>
        <div class="content">
            <div class="logo">
                <img src="images/lorry_icon.png" alt="logo">
            </div>

            <ul>

                <li><a href="#">Products</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Help</a></li>
                <li><a href="#">Team</a></li>

            </ul>

        </div>
    </nav>
    <aside></aside>

</body>

</html>
