<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <!-- CTRL + / -->
     <!-- Unordered list -->
      <ul>
        <li>London</li>
        <li>Paris</li>
        <li>Tokyo</li>
        <li>Nairobi</li>
        <li>Lusaka</li>
      </ul>


    <!-- Ordered list type 1, a, A, i-->
     <!-- what is the display if the items are more than 26 when using 'a' -->
      
      <ol type="i">
        <li>London</li>
        <li>Paris</li>
        <li>Tokyo</li>
        <li>Nairobi</li>
        <li>Lusaka</li>


      </ol>
    
</body>
</html>
