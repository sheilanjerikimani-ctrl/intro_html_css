<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            background: #afeeee;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

        }

        table {
            border: 1px solid #000000;
            border-collapse: collapse;
            width: 50 %;
            margin: auto;
            /* border collapse collapses all borders */
        }

        th {
            border: 1px solid #000000;
            padding-top: 10px;
            padding-bottom: 15px;
            text-align: left;
            background: #808080;
            padding-left: 20px;
            padding: right 13px;
        }

        td {
            border: 1px solid #000000;
            padding: 10px;
        }
        .DOB{
            background-color: #5f9ea0;
            color:#8b008b;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>DOB</th>
                <th>Gender</th>
        </thead>
        <tbody>
            <tr>
                <!-- td means table data -->
                <!-- tr means table row -->
                <td>Sheila</td>
                <td>Kimani</td>
                <td>sheila6njeri@gmail.com</td>
                <td class="DOB">19-10-2008</td>
                <td>Female</td>
            </tr>
            <tr>
                <!-- td means table data -->
                <!-- tr means table row -->
                <td>Joel</td>
                <td>Kim</td>
                <td>joe6njeri@gmail.com</td>
                <td class="DOB">19-10-2000</td>
                <td>Male</td>
            </tr>
            <tr>
                <!-- td means table data -->
                <!-- tr means table row -->
                <td>Mike</td>
                <td>Joe</td>
                <td>joe6mike@gmail.com</td>
                <td class="DOB">19-10-1997</td>
                <td>Male</td>
            </tr>
            <tr>
                <!-- td means table data -->
                <!-- tr means table row -->
                <td>Rose</td>
                <td>Wanja</td>
                <td>rose6mike@gmail.com</td>
                <td class="DOB">19-10-2026</td>
                <td>Female</td>
            </tr>

        </tbody>
    </table>
</body>

</html>
