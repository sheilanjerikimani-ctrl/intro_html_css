<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+CA+Guides&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f5f5f5;
            font-family: "Playwrite CA Guides", cursive;
            font-weight: 400;
            font-style: normal;

        }

        form {
            width: 50%;
            border: 1px solid #55A9A0;
            padding: 16px;
            margin: auto;
        }

        label {
            color: 55A9A0;

        }

        .full-width {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            border-color: #00ffff;
            padding: 16px;
            color: #000000;
            border-radius: 20px;

        }
    </style>
</head>

<body>
    <!-- text, email, password, number, date, gender, radio, checkbox, select, submit  -->
    <form>
        <br>
        <label for="full_name">Names</label>
        <input class="full-width" type="text" required id="full_name" name="full_name" placeholder="Jane Doe">

        <br>

        <label for="email">Email</label>
        <input class="full-width" type="email" required id="email" name="email" placeholder="doe@example.com">
        <br>

        <label for="pass">Password</label>
        <input class="full-width" type="password" required id="pass" name="pass" placeholder="*******">
        <br>


        <label for="weight">Weight</label>
        <input class="full-width" type="number" min="30" max="250" step="0.01" required id="weight" name="weight"
            placeholder="weight in kg">
        <br>

        <label for="dob">Date of Birth</label>
        <input class="full-width" type="date" min="1940-01-01" max="2008-12-31" required id="dob" name="pass">



        <!-- name must be the same for radio buttons -->
        <br>
        <label>Select your gender</label>
        <br>



        <input type="radio" required id="f" name="gender">
        <label for="f">Female</label>
        <br>


        <input type="radio" required id="m" name="gender">
        <label for="f">Male</label>

        <hr>
        <label>Select your favorite meal</label>

        <br>
        <input type="checkbox" required id="x" name="food">
        <label for="x">Pizza</label>

        <br>

        <input type="checkbox" required id="y" name="food">
        <label for="y">Burger</label>

        <br>

        <input type="checkbox" required id="z" name="food">
        <label for="z">Fish</label>



        <hr>
        <label>Select your country</label>
        <hr>
        <br>


        <select class="full-width">



            <option class="full-width">Select county</option>
            <option value="1">Mombasa</option>
            <option value="2">Nairobi</option>
            <option value="3">Nyeri</option>
            <option value="4">Kisii</option>
            <option value="5">Kisumu</option>
        </select>





        <button>Register</button>

    </form>
    <!-- range slider -->




</body>

</html>
